<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% unless page.nav == 'about' %}{{ page.title | escape }} | {% endunless %}{{ site.data.profile.name | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.data.profile.avatar | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <script>try{var profileTheme=localStorage.getItem('duanyu-theme');if(profileTheme==='light'||profileTheme==='dark')document.documentElement.style.colorScheme=profileTheme;}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
  <script src="{{ '/assets/js/profile.js' | relative_url }}" defer></script>
</head>
<body>
<div id="duanyu-folio" data-page="{{ page.nav | default: 'publications' }}">
  <header class="fl-nav-shell"><div class="fl-nav-inner">
    <a class="fl-brand" href="{{ '/' | relative_url }}"><strong>Duanyu</strong> Feng</a>
    <nav class="fl-nav" aria-label="Main navigation">
      {% for item in site.data.profile_navigation %}<a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
      <button type="button" data-theme aria-label="Change theme" aria-pressed="false">◐</button>
    </nav>
  </div></header>
  <main class="fl-main">{{ content }}</main>
  <footer class="fl-footer">© {{ site.time | date: '%Y' }} {{ site.data.profile.name }} · <a href="mailto:{{ site.data.profile.email }}">{{ site.data.profile.email }}</a></footer>
</div>
</body>
</html>
